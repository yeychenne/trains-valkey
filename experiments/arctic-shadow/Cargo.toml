[package]
name = "trains-valkey-arctic-shadow"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this experiment independent from the Rust 1.78 production workspace.
[workspace]

[features]
default = []
rwlock-generation = []

[dependencies]
arctic = { package = "arctic-map", version = "=0.1.3" }
arc-swap = "=1.9.2"
bincode = { version = "2", features = ["serde"] }
libc = "=0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
trains-core = { git = "https://github.com/yeychenne/trains-rust", rev = "da8c173878ed291a0935389de133313ef75fd132" }
trains-net = { git = "https://github.com/yeychenne/trains-rust", rev = "da8c173878ed291a0935389de133313ef75fd132" }
trains-valkey = { path = "../../crates/trains-valkey" }
